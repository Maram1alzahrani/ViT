<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380"><rect width="920" height="380" rx="18" fill="#f8fafc"/><text x="36" y="43" font-family="Arial" font-size="23" font-weight="bold" fill="#14263d">Attention score count: full vs 7 × 7 windows</text><rect x="145" y="155.7659908694032" width="54" height="144.2340091305968" fill="#4f46e5"/><rect x="206" y="174.70748858675398" width="54" height="125.29251141324603" fill="#0d9488"/><text x="145" y="327" font-family="Arial" font-size="17" fill="#475569">14 × 14</text><rect x="400" y="117.88299543470157" width="54" height="182.11700456529843" fill="#4f46e5"/><rect x="461" y="155.7659908694032" width="54" height="144.2340091305968" fill="#0d9488"/><text x="400" y="327" font-family="Arial" font-size="17" fill="#475569">28 × 28</text><rect x="655" y="80" width="54" height="220" fill="#4f46e5"/><rect x="716" y="136.82449315205238" width="54" height="163.17550684794762" fill="#0d9488"/><text x="655" y="327" font-family="Arial" font-size="17" fill="#475569">56 × 56</text><text x="55" y="365" font-family="Arial" font-size="14" fill="#475569">Bars use a logarithmic height scale; theoretical score counts, not measured FLOPs.</text><rect x="560" y="55" width="16" height="16" fill="#4f46e5"/><text x="583" y="69" font-family="Arial" font-size="14" fill="#475569">Full attention</text><rect x="715" y="55" width="16" height="16" fill="#0d9488"/><text x="738" y="69" font-family="Arial" font-size="14" fill="#475569">Window attention</text></svg>